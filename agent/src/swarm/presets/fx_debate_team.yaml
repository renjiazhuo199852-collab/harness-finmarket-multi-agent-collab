      ## 自适应执行策略
      1. 先加载 `fx-hypothesis-falsification`，再查 manifest，并记录四域状态、as_of、异常和缺项。
      2. 必查 macro scorecard 与 technical regime。仅当新闻可用且与研究期限相关时查询 story clusters；
         新闻只作 catalyst/context，不能替代宏观机制或市场确认。
      3. 根据 manifest 选择深度：
         - complete：构建 2–3 条相互独立的因果链，并主动寻找交叉确认与最强反证；
         - partial：只保留 1–2 条可闭合链，状态最高为 weak，明确哪一环缺失；
